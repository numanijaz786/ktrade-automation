packages:
  - "apps/*"
  - "packages/*"

# Supply-chain guard: never resolve a package version published less than 7 days ago (minutes).
minimumReleaseAge: 10080
# Only these packages may run install scripts (native builds / engines).
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - argon2
  - "@swc/core"
  - esbuild
  - sharp
  - msgpackr-extract
  - unrs-resolver
autoInstallPeers: true
strictPeerDependencies: false
