# Production stack for ONE private HTTPS URL on a small VPS (2 vCPU / 4 GB). See DEPLOYMENT_GUIDE.md.
#
#   docker compose -f infra/docker-compose.prod.yml up -d --build
#   docker compose -f infra/docker-compose.prod.yml run --rm api node dist/seed/seed.js
#
# Secrets: infra/.env.prod (gitignored; template infra/.env.prod.example). Optional shell variables
# (non-secret, with safe defaults): TLS_DIR (default /etc/letsencrypt), HTTP_PORT / HTTPS_PORT (80 / 443).
#
# Network layout — only nginx publishes ports:
#   edge     nginx ↔ web
#   app      web ↔ api                (has egress: a future market-data vendor)
#   data     api / migrate ↔ postgres / valkey   (internal: no egress, no host access)
# nginx is not on `app`, so the API is unreachable from outside; the browser only ever uses /bff/* on web.
name: ktrade-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - path: .env.prod
        required: true
    environment:
      POSTGRES_USER: ktrade
      POSTGRES_DB: ktrade
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256'
    # Modest tuning for ~1 GB; adjust with the VPS size.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=50
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    shm_size: 128mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ktrade -d ktrade']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 1g }
    logging: *logging

  valkey:
    # ADR-009: AOF persistence + noeviction (durable BullMQ queues). Reachable only on the internal `data` network.
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command:
      [
        'valkey-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '192mb',
        '--maxmemory-policy',
        'noeviction',
        '--protected-mode',
        'no',
      ]
    volumes:
      - valkeydata:/data
    networks: [data]
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256m }
    logging: *logging

  migrate:
    # One-shot: applies prisma/migrations, then exits 0. `api` waits for it.
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
      target: migrate
    image: ktrade-migrate:${IMAGE_TAG:-latest}
    restart: 'no'
    env_file:
      - path: .env.prod
        required: true
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy
    <<: *hardening
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 512m }
    logging: *logging

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
      target: runtime
    image: ktrade-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    env_file:
      - path: .env.prod
        required: true
    # Fixed production values (override anything in .env.prod). Schedulers stay configurable in .env.prod.
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3001'
      REDIS_URL: redis://valkey:6379
      COOKIE_SECURE: 'true'
      SWAGGER_ENABLED: 'false'
      NODE_OPTIONS: --max-old-space-size=512
    expose: ['3001']
    networks: [app, data]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m
    <<: *hardening
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 768m }
    logging: *logging

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_DATA_MODE: api
    image: ktrade-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    # No secrets: the BFF only needs the API's internal address.
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_DATA_MODE: api
      API_BASE_URL: http://api:3001/api/v1
      BFF_COOKIE_SECURE: 'true'
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      NODE_OPTIONS: --max-old-space-size=384
    expose: ['3000']
    networks: [edge, app]
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /app/apps/web/.next/cache:size=128m,uid=1000,gid=1000
    <<: *hardening
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 512m }
    logging: *logging

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      # Let's Encrypt (certbot --cert-name ktrade) → /etc/letsencrypt/live/ktrade/. Local test: TLS_DIR=./certs
      - ${TLS_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
    networks: [edge]
    depends_on:
      web:
        condition: service_healthy
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=1m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/nginx-health']
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 128m }
    logging: *logging

networks:
  edge: {}
  app: {}
  data:
    internal: true

volumes:
  pgdata:
  valkeydata:
