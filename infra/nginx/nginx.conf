# nginx front door for the KTrade stack (infra/docker-compose.prod.yml). TLS terminates here; every request
# is proxied to `web` (Next.js + BFF). The API is on a network nginx is not attached to.
user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  types_hash_max_size 2048;

  # Request limits: statement imports send up to 3 MB of JSON (the BFF/API enforce 3 MB themselves).
  client_max_body_size 4m;
  client_body_buffer_size 128k;
  client_body_timeout 15s;
  client_header_timeout 15s;
  send_timeout 30s;
  large_client_header_buffers 4 16k;

  # JSON access log without cookies, auth headers or query strings (tokens never appear in URLs, but be safe).
  log_format json escape=json '{"t":"$time_iso8601","ip":"$remote_addr","m":"$request_method",'
    '"p":"$uri","s":$status,"b":$body_bytes_sent,"rt":$request_time,"urt":"$upstream_response_time",'
    '"ua":"$http_user_agent"}';
  access_log /dev/stdout json;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/plain text/css text/javascript application/javascript application/json
    application/problem+json application/manifest+json image/svg+xml text/x-component;

  # Rate limits (per client IP). Credential endpoints are strict; the rest of /bff/auth/ (me, refresh,
  # logout) is called on page loads so it gets a looser bucket. 429 instead of the default 503.
  limit_req_zone $binary_remote_addr zone=auth_strict:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=60r/m;
  limit_req_zone $binary_remote_addr zone=bff:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_req_status 429;
  limit_conn_status 429;

  # Docker's embedded DNS: re-resolve `web` if its container is recreated.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  include /etc/nginx/conf.d/*.conf;
}
