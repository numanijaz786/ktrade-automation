# Single private site. Certificates come from certbot with a fixed cert name (`--cert-name ktrade`), so this
# file needs no domain: /etc/letsencrypt/live/ktrade/{fullchain,privkey}.pem. infra/scripts/dev-selfsigned.sh
# writes the same layout into infra/certs/ for local testing (TLS_DIR=./certs).

# ── :80 — health probe for the container, everything else → HTTPS ──
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  location = /nginx-health {
    access_log off;
    allow 127.0.0.1;
    deny all;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ── :443 — the app ──
server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  http2 on;
  server_name _;

  ssl_certificate /etc/letsencrypt/live/ktrade/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ktrade/privkey.pem;
  include /etc/nginx/snippets/tls.conf;

  # Optional owner-only access (uncomment in snippets/allowlist.conf).
  include /etc/nginx/snippets/allowlist.conf;

  include /etc/nginx/snippets/security-headers.conf;

  limit_conn perip 50;

  # Credential endpoints: login, register, step-up.
  location ~ ^/bff/auth/(login|register|step-up)$ {
    limit_req zone=auth_strict burst=5 nodelay;
    include /etc/nginx/snippets/proxy-web.conf;
  }

  # Other auth endpoints (me, refresh, logout) — called on page loads.
  location /bff/auth/ {
    limit_req zone=auth burst=30 nodelay;
    include /etc/nginx/snippets/proxy-web.conf;
  }

  location /bff/ {
    limit_req zone=bff burst=40 nodelay;
    include /etc/nginx/snippets/proxy-web.conf;
  }

  # Hashed, immutable build assets (Next sets long-lived Cache-Control itself).
  location /_next/static/ {
    include /etc/nginx/snippets/proxy-web.conf;
  }

  location / {
    include /etc/nginx/snippets/proxy-web.conf;
  }
}
