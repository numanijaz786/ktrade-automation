# Security headers for every HTTPS response (`always` = also on 4xx/5xx).
# NOTE: nginx drops server-level add_header in any location that declares its own add_header,
# so locations must not use add_header (or must include this file again).

# 2 years. Add `; preload` only once you are sure every subdomain is HTTPS-only.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), interest-cohort=()" always;

# CSP compatible with Next.js 16 without nonces: the App Router streams inline <script> RSC payloads and
# next-themes injects an inline script, so script-src needs 'unsafe-inline' (no 'unsafe-eval' in production).
# Charts (recharts, lightweight-charts) and Radix set inline styles. Fonts are self-hosted by next/font.
# Everything else is same-origin: the browser only talks to /bff/*.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
