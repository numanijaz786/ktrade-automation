# Proxy to the Next.js container. A variable + resolver lets nginx follow a recreated `web` container.
set $web_upstream http://web:3000;
proxy_pass $web_upstream;
proxy_http_version 1.1;
proxy_set_header Connection "";

# The BFF's CSRF check compares Origin with X-Forwarded-Host / Host, so both must be the public host.
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Real-IP $remote_addr;

proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
proxy_buffers 16 16k;
proxy_buffer_size 16k;

proxy_hide_header X-Powered-By;
